<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF AI Assistant</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .answer-text { white-space: pre-wrap; }
        .answer-meta { margin-top: 8px; font-size: 0.78rem; opacity: 0.75; }
        .answer-sources { margin-top: 6px; font-size: 0.8rem; }
        .answer-sources summary { cursor: pointer; opacity: 0.8; }
        .source-item { margin: 6px 0; padding: 6px 8px; border-left: 3px solid rgba(127,127,127,0.4); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- PDF Viewer Section -->
        <div class="pdf-section">
            <div class="pdf-header">
                <h2><i class="fas fa-file-pdf"></i> PDF Viewer</h2>
                <div class="upload-controls">
                    <button onclick="document.getElementById('pdf-file').click()" class="select-pdf-btn">
                        <i class="fas fa-file-upload"></i> Select PDF
                    </button>
                    <span class="file-name">No file selected</span>
                </div>
                <form id="pdf-upload-form" style="display: none;">
                    <input type="file" id="pdf-file" name="pdf_files" accept=".pdf" multiple>
                </form>
            </div>
            <div id="upload-loading" class="loading">
                <div class="loader"></div>
                <span>Processing PDF...</span>
            </div>
            <div id="upload-error" class="error-message"></div>
            <div id="pdf-viewer" class="pdf-content">
                <div id="pdf-placeholder">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Upload a PDF to begin</p>
                </div>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-section">
            <div class="chat-header">
                <h2><i class="fas fa-robot"></i> AI Assistant</h2>
            </div>

            <div class="chat-history" id="chat-history">
                <div class="chat-message ai-message">
                    <div class="message-content">
                        <p>Hello! I'm your AI assistant. Upload a PDF and I'll help you analyze it.</p>
                    </div>
                </div>
                {% for chat in chat_history %}
                    <div class="chat-message user-message">
                        <div class="message-content">
                            <p>{{ chat.question }}</p>
                        </div>
                    </div>
                    <div class="chat-message ai-message">
                        <div class="message-content">
                            <p>{{ chat.answer }}</p>
                        </div>
                    </div>
                {% endfor %}
            </div>

            <div id="chat-loading" class="loading">
                <div class="loader"></div>
                <span>Processing your question...</span>
            </div>
            <div id="chat-error" class="error-message"></div>

            <div class="input-section">
                <form id="chat-form" style="display: none;">
                    <div class="input-wrapper">
                        <input type="text" name="user_question" id="user-question"
                               placeholder="Ask me anything about the PDF..." required>
                        <button type="submit">
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>

    document.addEventListener('DOMContentLoaded', function() {
        const pdfFile = document.getElementById('pdf-file');
        const fileName = document.querySelector('.file-name');
        const pdfUploadForm = document.getElementById('pdf-upload-form');
        const pdfViewer = document.getElementById('pdf-viewer');
        const pdfPlaceholder = document.getElementById('pdf-placeholder');
        const chatForm = document.getElementById('chat-form');
        const chatHistory = document.getElementById('chat-history');
        const uploadLoading = document.getElementById('upload-loading');
        const chatLoading = document.getElementById('chat-loading');
        const uploadError = document.getElementById('upload-error');
        const chatError = document.getElementById('chat-error');
    
        // Typewriter effect: writes plain text only (textContent), so model output can never inject HTML/JS.
        // Reveals in word-sized steps and is capped at ~1.5 s so long answers are not slowed down.
        function typewriterEffect(element, text, onDone) {
            const words = text.split(/(\s+)/);
            const step = Math.max(1, Math.ceil(words.length / 75));
            let i = 0;
            element.textContent = '';
            (function type() {
                if (i < words.length) {
                    element.textContent += words.slice(i, i + step).join('');
                    i += step;
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                    setTimeout(type, 20);
                } else if (onDone) { onDone(); }
            })();
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        // Sources + token/cost line under each answer (built with textContent, never innerHTML).
        function renderMeta(container, data) {
            const u = data.usage || {}, lat = data.latency_ms || {};
            const cost = (u.cost_usd === null || u.cost_usd === undefined) ? 'n/a' : '$' + Number(u.cost_usd).toFixed(6);
            const parts = [
                (data.citations && data.citations.length) ? 'Sources: ' + data.citations.join(', ') : null,
                `${u.input_tokens ?? 0} in / ${u.output_tokens ?? 0} out tokens`,
                `cost ${cost}${u.cached ? ' (cached, 0 API calls)' : ''}`,
                lat.total ? `${(lat.total / 1000).toFixed(1)} s` : null,
            ].filter(Boolean);
            container.appendChild(el('div', 'answer-meta', parts.join(' · ')));
            if (data.sources && data.sources.length) {
                const det = el('details', 'answer-sources');
                det.appendChild(el('summary', null, 'Show retrieved excerpts'));
                data.sources.forEach(s => {
                    const item = el('div', 'source-item');
                    item.appendChild(el('strong', null, `#${s.rank} (${s.pages}) `));
                    item.appendChild(el('span', null, s.text.length > 600 ? s.text.slice(0, 600) + '…' : s.text));
                    det.appendChild(item);
                });
                container.appendChild(det);
            }
        }
    
        // Handle file selection - unchanged from original
        pdfFile.addEventListener('change', function(e) {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
                handleUpload();
            } else {
                fileName.textContent = 'No file selected';
            }
        });
    
        // Handle file upload - unchanged from original
        async function handleUpload() {
            uploadError.style.display = 'none';
            uploadLoading.style.display = 'flex';
    
            try {
                const formData = new FormData(pdfUploadForm);
                const response = await fetch('/chat/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Show PDF in viewer
                    const pdfUrl = URL.createObjectURL(pdfFile.files[0]);
                    pdfPlaceholder.style.display = 'none';
                    pdfViewer.replaceChildren();
                    const embed = document.createElement('embed');
                    embed.src = pdfUrl; embed.type = 'application/pdf'; embed.width = '100%'; embed.height = '100%';
                    pdfViewer.appendChild(embed);

                    // Enable chat interface
                    chatForm.style.display = 'flex';
                    if (data.document) {
                        const d = data.document;
                        const note = el('div', 'chat-message ai-message');
                        const c = el('div', 'message-content');
                        c.appendChild(el('p', null, `Indexed "${d.title}": ${d.pages} pages → ${d.n_chunks} chunks` +
                            (d.reused_existing_index ? ' (already indexed, reused instantly).' : ` in ${d.seconds}s.`) +
                            ' Ask me anything — answers cite page numbers.'));
                        note.appendChild(c);
                        chatHistory.appendChild(note);
                    }
                } else {
                    uploadError.textContent = data.message;
                    uploadError.style.display = 'block';
                }
            } catch (error) {
                uploadError.textContent = 'Error uploading PDF. Please try again.';
                uploadError.style.display = 'block';
            } finally {
                uploadLoading.style.display = 'none';
            }
        }
    
        // Handle chat submission - modified to include typewriter effect
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const userQuestion = document.getElementById('user-question');
            
            if (!userQuestion.value.trim()) {
                return; // Don't submit empty questions
            }
            
            const userQuestionText = userQuestion.value;
            chatError.style.display = 'none';
            chatLoading.style.display = 'flex';
    
            try {
                // Add user message immediately
                const userMessage = el('div', 'chat-message user-message');
                const userContent = el('div', 'message-content');
                userContent.appendChild(el('p', null, userQuestionText));
                userMessage.appendChild(userContent);
                chatHistory.appendChild(userMessage);
                
                // Clear input and scroll to show user's message
                userQuestion.value = '';
                chatHistory.scrollTop = chatHistory.scrollHeight;
    
                // Create form data with the question
                const formData = new FormData();
                formData.append('user_question', userQuestionText);
                
                const response = await fetch('/chat/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Add AI response container
                    const aiMessage = el('div', 'chat-message ai-message');
                    const aiContent = el('div', 'message-content');
                    const responseElement = el('p', 'answer-text');
                    aiContent.appendChild(responseElement);
                    aiMessage.appendChild(aiContent);
                    chatHistory.appendChild(aiMessage);

                    typewriterEffect(responseElement, data.answer, () => renderMeta(aiContent, data));
                    
                    // Scroll to bottom to follow the typing
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                } else {
                    chatError.textContent = data.message;
                    chatError.style.display = 'block';
                }
            } catch (error) {
                chatError.textContent = 'Error sending message. Please try again.';
                chatError.style.display = 'block';
            } finally {
                chatLoading.style.display = 'none';
            }
        });
    });
    </script>
</body>
</html>
