<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">MetaPDF</title>
  <desc id="d">Evaluated RAG for document Q&amp;A. Evidence retrieved 71% to 94%, input tokens cut 74%, answers with unsupported claims 50% to 14%.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#121A36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="160" cy="40" r="260" fill="url(#glow1)"/>
    <circle cx="1080" cy="360" r="300" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- left: title -->
  <g class="sans">
    <rect x="64" y="72" width="292" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="84" cy="87" r="4.5" fill="#34D399"/>
    <text x="98" y="92" class="mono" font-size="12.5" fill="#CBD5E1" letter-spacing="1.2">EVALUATED RAG · DOCUMENT Q&amp;A</text>

    <text x="62" y="178" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Meta<tspan fill="url(#accent)">PDF</tspan></text>
    <text x="64" y="222" font-size="21" fill="#CBD5E1">Chat with any PDF. Every answer cites its page.</text>
    <text x="64" y="252" font-size="21" fill="#CBD5E1">Every design choice is measured.</text>

    <g class="mono" font-size="12.5" fill="#94A3B8">
      <rect x="64" y="292" width="124" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="126" y="311" text-anchor="middle">Hybrid BM25</text>
      <rect x="196" y="292" width="104" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="248" y="311" text-anchor="middle">Reranker</text>
      <rect x="308" y="292" width="112" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="364" y="311" text-anchor="middle">NLI checks</text>
      <rect x="428" y="292" width="98" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="477" y="311" text-anchor="middle">Gemini</text>
    </g>
  </g>

  <!-- right: metric cards -->
  <g class="sans">
    <!-- card 1 -->
    <rect x="640" y="64" width="496" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="640" y="64" width="4" height="76" rx="2" fill="#22D3EE"/>
    <text x="668" y="112" font-size="38" font-weight="800" fill="#F8FAFC">94%</text>
    <text x="804" y="96" font-size="15" font-weight="600" fill="#E2E8F0">right evidence retrieved</text>
    <text x="804" y="119" font-size="13.5" fill="#94A3B8">was 71% · hit@5 on 35 labelled questions</text>

    <!-- card 2 -->
    <rect x="640" y="152" width="496" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="640" y="152" width="4" height="76" rx="2" fill="#8B5CF6"/>
    <text x="668" y="200" font-size="38" font-weight="800" fill="#F8FAFC">14%</text>
    <text x="804" y="184" font-size="15" font-weight="600" fill="#E2E8F0">answers with an unsupported claim</text>
    <text x="804" y="207" font-size="13.5" fill="#94A3B8">was 50% · checked by a local NLI model</text>

    <!-- card 3 -->
    <rect x="640" y="240" width="496" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="640" y="240" width="4" height="76" rx="2" fill="#34D399"/>
    <text x="668" y="288" font-size="38" font-weight="800" fill="#F8FAFC">−74%</text>
    <text x="804" y="272" font-size="15" font-weight="600" fill="#E2E8F0">input tokens per question</text>
    <text x="804" y="295" font-size="13.5" fill="#94A3B8">10,525 → 2,751 · cost $3.89 → $0.99 per 1k</text>
  </g>
</svg>
